---
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qa_actions:
    name: qa_actions
    if: github.repository_owner_id == '45983094' && github.actor_id == '45983094' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Changed Files
        uses: tj-actions/changed-files@v47.0.6
      - name: typos-action
        uses: crate-ci/typos@v1.46.1

  lint:
    name: lint
    if: github.repository_owner_id == '45983094' && github.actor_id == '45983094' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff
        run: ruff check .
      - name: Python compile check
        run: python -m compileall -q custom_components

  tests:
    name: tests
    if: github.repository_owner_id == '45983094' && github.actor_id == '45983094' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==2026.9.3 pytest pytest-asyncio
      - name: Pytest
        run: python -m pytest -q tests/test_config_flow.py tests/test_auth_device.py tests/test_coordinator.py tests/test_weekly_reset_calendar.py

  validate:
    name: validate
    if: github.repository_owner_id == '45983094' && github.actor_id == '45983094' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
    runs-on: [self-hosted, Linux, X64]
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest schema keys
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          manifest = Path('custom_components/codex_usage/manifest.json')
          data = json.loads(manifest.read_text())
          required = ['domain', 'name', 'version', 'config_flow']
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing manifest keys: {missing}")
          print('Validation passed')
          PY
      - name: Python compile check
        run: python -m compileall -q custom_components
